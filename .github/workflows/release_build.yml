name: Release Go project

on:
  push:
    tags:
      - "*" # triggers only if push new tag version, like `0.8.4` or else

permissions:
  contents: write

jobs:
  build:
    name: GoReleaser build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # See: https://goreleaser.com/ci/actions/

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
        id: go

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # ratchet:goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pin to the v2 major. goreleaser-action no longer treats `latest`
          # as the absolute latest (it warns and locks to `~> v2` anyway), and
          # an unpinned `latest` risks a future goreleaser v3 silently breaking
          # releases via config-schema changes. Bump deliberately when adopting v3.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GO_RELEASER_GITHUB_TOKEN }}
          # Take the version from the pushed tag. A release and the candidate it
          # was cut from can sit on the same commit, and goreleaser otherwise
          # reads the version from git describe, which picked the candidate and
          # failed uploading its assets a second time.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}