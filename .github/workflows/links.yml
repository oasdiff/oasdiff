name: detect-broken-links
on:
  push:
    branches: [main]
    paths: ['**.md', '**.html', '.github/workflows/links.yml', '.github/workflows/mlc_config.json']
  pull_request:
    paths: ['**.md', '**.html', '.github/workflows/links.yml', '.github/workflows/mlc_config.json']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-links:
    name: check-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # ratchet:gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/workflows/mlc_config.json'
