openapi: 3.0.3
info: {title: t, version: "1"}
paths:
  /x:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tree:
                  allOf:
                    - $ref: "#/components/schemas/NodeA"
                    - type: object
                      properties:
                        child:
                          $ref: "#/components/schemas/Plain"
      responses:
        "200": {description: ok}
