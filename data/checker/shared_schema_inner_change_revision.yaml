openapi: 3.1.0
info:
  title: a change inside a shared schema
  version: 1.0.0
paths:
  /example:
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  left:
                    $ref: '#/components/schemas/Shared'
                  right:
                    $ref: '#/components/schemas/Shared'
components:
  schemas:
    Shared:
      type: object
      properties:
        id:
          type: integer
