openapi: 3.1.0
info:
  title: Test
  version: "1.0"
paths:
  /items:
    post:
      operationId: createItem
      parameters:
        - name: ids
          in: query
          schema:
            type: array
            items: {type: string}
            minItems: 3
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items: {type: string}
                  minItems: 3
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items: {type: string}
  /batch:
    post:
      operationId: createBatch
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: {type: string}
              minItems: 2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
