openapi: 3.1.0
info: {title: t, version: "1.0.0"}
paths:
  /test:
    get:
      operationId: testOp
      parameters:
        - name: X-Meta
          in: header
          schema:
            type: object
            properties:
              owner:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [id]
                    properties:
                      id: {type: string}
              status:
                oneOf:
                  - type: "null"
                  - type: string
                    enum: [active, retired]
        - name: X-Owner
          in: header
          schema:
            oneOf:
              - type: "null"
              - type: object
                required: [id]
                properties:
                  id: {type: string}
        - name: X-Status
          in: header
          schema:
            oneOf:
              - type: "null"
              - type: string
                enum: [active, retired]
      responses:
        "200": {description: OK}
