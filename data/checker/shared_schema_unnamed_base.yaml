    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  left:
                    $ref: '#/components/schemas/Holder/properties/inner'
                  right:
                    $ref: '#/components/schemas/Holder/properties/inner'
components:
  schemas:
    Holder:
      type: object
      properties:
        inner:
          type: object
          properties:
            id:
              type: string
