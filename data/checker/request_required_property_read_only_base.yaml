openapi: 3.0.0
info:
  title: Sample API
  version: 1.0.0
paths:
  /api/v1.0/groups:
    post:
      operationId: createOneGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: integer
                  readOnly: true
                name:
                  type: string
