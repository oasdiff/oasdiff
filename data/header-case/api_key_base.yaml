openapi: 3.0.3
info:
  title: api key case
  version: '1'
security:
  - header_key: []
  - query_key: []
paths:
  /pets:
    get:
      responses:
        '200':
          description: ok
components:
  securitySchemes:
    header_key:
      type: apiKey
      in: header
      name: X-API-Key
    query_key:
      type: apiKey
      in: query
      name: Api-Key
