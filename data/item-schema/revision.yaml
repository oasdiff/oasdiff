openapi: 3.2.0
info:
  title: streaming
  version: "1.0"
paths:
  /events:
    get:
      responses:
        "200":
          description: a stream of events
          content:
            text/event-stream:
              itemSchema:
                type: object
                required: [id, kind]
                properties:
                  id:
                    type: string
                  kind:
                    type: string
                    enum: [created, updated]
  /ingest:
    post:
      requestBody:
        content:
          application/jsonl:
            itemSchema:
              type: object
              required: [name, weight]
              properties:
                name:
                  type: string
                weight:
                  type: number
      responses:
        "202":
          description: accepted
  /drop:
    post:
      requestBody:
        content:
          application/jsonl:
            schema:
              type: object
            itemSchema:
              type: object
      responses:
        "200":
          description: ok
          content:
            application/jsonl: {}
  /keep:
    get:
      responses:
        "200":
          description: ok
          content:
            application/jsonl:
              schema:
                type: object
