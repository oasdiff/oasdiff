openapi: 3.0.3
info:
  title: recursive schema referenced from an allOf overlay
  version: "1"
paths:
  /x:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  items:
                    allOf:
                      - $ref: "#/components/schemas/Node"
                      - type: object
                        properties:
                          filters:
                            type: array
                            items:
                              $ref: "#/components/schemas/Node"
      responses:
        "200":
          description: ok
components:
  schemas:
    Node:
      description: recursive filter tree, modified
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: "#/components/schemas/Node"
