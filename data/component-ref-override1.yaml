openapi: 3.1.0
info:
  title: a $ref with a description beside it
  version: 1.0.0
paths:
  /example:
    get:
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  left:
                    $ref: '#/components/schemas/Shared'
                    description: the left one
                  nested:
                    $ref: '#/components/schemas/Holder/properties/inner'
components:
  schemas:
    Shared:
      type: object
      properties:
        id:
          type: string
    Holder:
      type: object
      properties:
        inner:
          type: string
