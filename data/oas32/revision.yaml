openapi: 3.2.0
info:
  title: custom methods
  version: "1.0"
paths:
  /search:
    query:
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term:
                  type: integer
      responses:
        "200":
          description: results
    additionalOperations:
      COPY:
        operationId: copySearch
        deprecated: true
        responses:
          "200":
            description: copied
      MOVE:
        operationId: moveSearch
        responses:
          "200":
            description: moved
  /new:
    query:
      operationId: newQuery
      responses:
        "200":
          description: ok
